# ============================================
# TravelPro Application Configuration
# ============================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/travelpro_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Dhiraj@11
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
# ddl-auto: update will auto-create tables based on entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ML Engine Configuration
ml.engine.url=http://localhost:8000

# JWT Configuration
jwt.secret=TravelProSecretKeyForJWTTokenGenerationChangeThisInProduction2024
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501

# Logging Configuration
logging.level.com.traveller.demo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Jackson Configuration (JSON)
# spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Spring Session - auto-create session tables in MySQL
spring.session.jdbc.initialize-schema=always
