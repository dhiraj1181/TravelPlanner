<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TravelPro Dashboard - Manage your travel plans">
    <title>Dashboard - TravelPro</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="icon" type="image/png" href="assets/images/icon.png">

    <style>
        /* Dashboard-specific layout styles */
        body {
            display: flex;
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: var(--space-8);
            background-color: var(--color-gray-50);
            min-height: 100vh;
        }

        .dashboard-header {
            margin-bottom: var(--space-8);
        }

        .dashboard-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-2);
        }

        .trips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-6);
        }

        @media (max-width: 768px) {
            .main-content {
                margin-left: 0;
            }

            .trips-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- ========== Sidebar Navigation ========== -->
    <aside class="sidebar">
        <!-- Logo/Brand -->
        <div class="sidebar-header">
            <!-- <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M21 16V14L13 9V3.5C13 2.67 12.33 2 11.5 2C10.67 2 10 2.67 10 3.5V9L2 14V16L10 13.5V19L8 20.5V22L11.5 21L15 22V20.5L13 19V13.5L21 16Z"
                    fill="currentColor" />
            </svg> -->
            <img src="assets/images/logo.png" alt="TravelPro icon" style="height:32px;width:32px;object-fit:contain;border-radius:6px;vertical-align:middle;margin-right:4px;">
            <span
                style="font-family: var(--font-family-heading); font-weight: var(--font-weight-bold); font-size: var(--font-size-xl);">TravelPro</span>
        </div>

        <!-- Navigation Menu -->
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="sidebar-nav-item active">
                <!-- Home icon -->
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Dashboard
            </a>

            <a href="destinations.html" class="sidebar-nav-item">
                <!-- Map icon -->
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z"
                        fill="currentColor" />
                </svg>
                Destinations
            </a>

            <a href="wishlist.html" class="sidebar-nav-item">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20.84 4.61C20.3292 4.09944 19.7228 3.69533 19.0554 3.4208C18.3879 3.14626 17.6725 3.00672 16.95 3.00672C16.2275 3.00672 15.5121 3.14626 14.8446 3.4208C14.1772 3.69533 13.5708 4.09944 13.06 4.61L12 5.67L10.94 4.61C9.90831 3.57831 8.50903 3.00085 7.05 3.00085C5.59096 3.00085 4.19169 3.57831 3.16 4.61C2.12831 5.64169 1.55085 7.04097 1.55085 8.5C1.55085 9.95903 2.12831 11.3583 3.16 12.39L4.22 13.45L12 21.23L19.78 13.45L20.84 12.39C21.3506 11.8792 21.7547 11.2728 22.0292 10.6054C22.3037 9.93789 22.4433 9.2225 22.4433 8.5C22.4433 7.7775 22.3037 7.06211 22.0292 6.39461C21.7547 5.72711 21.3506 5.12075 20.84 4.61Z"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Wishlist
            </a>

            <a href="trip-history.html" class="sidebar-nav-item">
                <!-- History clock icon -->
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 8V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M3.05 11A9 9 0 1 0 4 7.5L1 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M1 3V7H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Trip History
            </a>
        </nav>

        <!-- User Profile Section -->
        <div class="sidebar-user">
            <div class="sidebar-user-info">
                <div class="sidebar-user-avatar" id="userAvatar">D</div>
                <div class="sidebar-user-details">
                    <div class="sidebar-user-name" id="userName">Dhiraj_verma</div>
                    <div class="sidebar-user-email" id="userEmail">dhirajverma@gmail.com</div>
                </div>
            </div>
            <button class="sidebar-logout" id="logoutBtn">
                <!-- Logout icon -->
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M16 17L21 12L16 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Logout
            </button>
        </div>
    </aside>

    <!-- ========== Main Content Area ========== -->
    <main class="main-content">
        <!-- Dashboard Header -->
        <header class="dashboard-header">
            <div class="dashboard-header-top">
                <div>
                    <h1 id="welcomeMessage">Welcome back, Dhiraj_verma</h1>
                    <p style="color: var(--color-gray-600);">Manage your travel plans</p>
                </div>
                <button class="btn btn-primary" id="createTripBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Create Trip
                </button>
            </div>
        </header>

        <!-- Trips Grid -->
        <div id="tripsContainer">
            <!-- Trips will be dynamically loaded here -->
            <!-- Empty state shown when no trips -->
            <div class="empty-state" id="emptyState">
                <!-- Location pin icon -->
                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z"
                        fill="currentColor" />
                </svg>
                <h2 class="empty-state-title">No trips yet</h2>
                <p class="empty-state-description">Start planning your first adventure</p>
                <button class="btn btn-primary" onclick="window.location.href='create-trip.html'">
                    Create Your First Trip
                </button>
            </div>

            <!-- Trips will be rendered here when available -->
            <div class="trips-grid hidden" id="tripsGrid">
                <!-- Trip cards will be dynamically inserted here -->
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>

    <script>
        /**
         * Dashboard initialization and trip loading
         */
        document.addEventListener('DOMContentLoaded', function () {
            // Check if user is authenticated
            checkAuthentication();

            // Load user data
            loadUserData();

            // Load user's trips
            loadTrips();

            // Event listeners
            document.getElementById('createTripBtn').addEventListener('click', function () {
                window.location.href = 'create-trip.html';
            });

            document.getElementById('logoutBtn').addEventListener('click', function () {
                logout();
            });
        });

        /**
         * Check if user is authenticated, redirect to home if not
         */
        function checkAuthentication() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = 'index.html';
            }
        }

        /**
         * Load user data from localStorage and display
         */
        function loadUserData() {
            const userData = JSON.parse(localStorage.getItem('userData') || '{}');

            if (userData.name) {
                document.getElementById('userName').textContent = userData.name;
                document.getElementById('welcomeMessage').textContent = `Welcome back, ${userData.name}`;

                // Set avatar initial
                const initial = userData.name.charAt(0).toUpperCase();
                document.getElementById('userAvatar').textContent = initial;
            }

            if (userData.email) {
                document.getElementById('userEmail').textContent = userData.email;
            }
        }

        /**
         * Load user's trips from localStorage
         */
        function loadTrips() {
            const trips = JSON.parse(localStorage.getItem(APP_CONSTANTS.STORAGE_KEYS.USER_TRIPS) || '[]');

            if (!trips || trips.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('tripsGrid').classList.add('hidden');
            } else {
                document.getElementById('emptyState').classList.add('hidden');
                document.getElementById('tripsGrid').classList.remove('hidden');
                renderTrips(trips);
            }
        }

        /**
         * Render trips in the grid
         */
        function renderTrips(trips) {
            const grid = document.getElementById('tripsGrid');
            grid.innerHTML = '';

            trips.forEach(trip => {
                const card = createTripCard(trip);
                grid.appendChild(card);
            });
        }

        /**
         * Create a trip card element
         */
        function createTripCard(trip) {
            const card = document.createElement('div');
            card.className = 'trip-card';
            card.onclick = () => viewItinerary(trip.id);

            card.innerHTML = `
                <div class="trip-card-body">
                    <h3 class="trip-card-title">${trip.title || trip.destination}</h3>
                    <p style="color: var(--color-gray-600); font-size: var(--font-size-sm);">
                        ${trip.destination}
                    </p>
                    <div class="trip-card-meta">
                        <div class="trip-card-meta-item">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
                                <line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="8" y1="2" x2="8" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="2"/>
                            </svg>
                            ${trip.days} days
                        </div>
                        <div class="trip-card-meta-item">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <line x1="12" y1="1" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M17 5H9.5C7.01472 5 5 7.01472 5 9.5C5 11.9853 7.01472 14 9.5 14H14.5C16.9853 14 19 16.0147 19 18.5C19 20.9853 16.9853 23 14.5 23H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            ₹${trip.budget}
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        /**
         * Navigate to itinerary view
         */
        function viewItinerary(tripId) {
            window.location.href = `itinerary.html?id=${tripId}`;
        }

        /**
         * Logout user
         */
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
