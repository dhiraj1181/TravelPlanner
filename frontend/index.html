<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="TravelPro - Smart itinerary planning powered by intelligent algorithms. Discover destinations, manage budgets, and create unforgettable travel experiences.">
    <title>TravelPro - Plan Your Dream Journey</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!-- ========== Navigation Bar ========== -->
    <nav class="navbar">
        <div class="navbar-brand">
            <!-- Plane icon SVG -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M21 16V14L13 9V3.5C13 2.67 12.33 2 11.5 2C10.67 2 10 2.67 10 3.5V9L2 14V16L10 13.5V19L8 20.5V22L11.5 21L15 22V20.5L13 19V13.5L21 16Z"
                    fill="currentColor" />
            </svg>
            TravelPro
        </div>
        <button class="btn btn-primary" id="getStartedBtn">Get Started</button>
    </nav>

    <!-- ========== Hero Section ========== -->
    <section class="hero">
        <div class="hero-content">
            <!-- Left: Text Content -->
            <div class="hero-text animate-slideInUp">
                <h1 class="hero-title">
                    Plan Your Dream
                    <span class="hero-title-accent">Journey</span>
                </h1>
                <p class="hero-description">
                    Smart itinerary planning powered by intelligent algorithms. Discover destinations, manage budgets,
                    and create unforgettable travel experiences.
                </p>
                <button class="btn btn-primary btn-lg" id="startPlanningBtn">
                    Start Planning
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13.5 4.5L21 12M21 12L13.5 19.5M21 12H3" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <!-- Right: Hero Image -->
            <div class="hero-image animate-slideInDown">
                <img src="assets/images/img.jpg" alt="Mountain landscape with traveler" id="heroImage">
            </div>
        </div>
    </section>

    <!-- ========== Authentication Modal ========== -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="modal-close" id="closeAuthModal">&times;</button>

            <h2 class="text-center mb-6">Welcome to TravelPro</h2>

            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Login</button>
                <button class="auth-tab" data-tab="register">Register</button>
            </div>

            <!-- Login Tab Content -->
            <div class="auth-tab-content active" id="loginTab">
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" name="email" placeholder="your.email@example.com"
                            required />
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" placeholder="Enter your password"
                            required />
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Login
                    </button>
                </form>
            </div>

            <!-- Register Tab Content -->
            <div class="auth-tab-content" id="registerTab">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="registerName">Full Name</label>
                        <input type="text" id="registerName" name="name" placeholder="John Doe" required />
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" name="email" placeholder="your.email@example.com"
                            required />
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <input type="password" id="registerPassword" name="password"
                            placeholder="Create a strong password" required />
                    </div>

                    <div class="form-group">
                        <label for="registerConfirmPassword">Confirm Password</label>
                        <input type="password" id="registerConfirmPassword" name="confirmPassword"
                            placeholder="Re-enter your password" required />
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        Register
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
